pre-commit:
  commands:
    lint:
      root: deck/
      run: bunx biome check --staged --no-errors-on-unmatched
      stage_fixed: true

commit-msg:
  commands:
    validate:
      run: |
        commit_msg=$(head -1 {1})
        if ! echo "$commit_msg" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\(.+\))?: .+'; then
          echo "ERROR: Commit message must follow conventional commits format."
          echo "  e.g., feat: add new feature"
          echo "  e.g., fix(auth): resolve login bug"
          echo "Got: $commit_msg"
          exit 1
        fi
